name: Publish verified signed Red Potato Downloader APK
on:
  push:
    branches: ['release/publish-v1.4.5']
    paths: ['.github/workflows/publish-signed.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download signed artifact from isolated AniCh workflow
        uses: actions/download-artifact@v4
        with:
          repository: upwon/AniCh
          run-id: 40214971986
          artifact-ids: '12607093591'
          github-token: ${{ github.token }}
          path: dist
      - name: Verify source, APK checksum and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find dist -name xhs-upwon-1.4.5-release.apk -type f)
          test -n "$APK"
          DIRECTORY=$(dirname "$APK")
          echo "ASSET_DIR=$DIRECTORY" >> "$GITHUB_ENV"
          test "$(cat "$DIRECTORY/SOURCE_COMMIT.txt")" = '55ea586cb2186202458b17c0bd2b5159e8f95602'
          test "$(sha256sum "$APK" | cut -d ' ' -f1)" = '3dac560119c18cb52a7014109d0e5c413f0f62474c9f1d6ca031b7165bdae239'
          (cd "$DIRECTORY" && sha256sum --check SHA256SUMS.txt)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/xhs-certificate.txt
          ACTUAL=$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' /tmp/xhs-certificate.txt | tr 'A-F' 'a-f' | tr -d ':')
          test "$ACTUAL" = 'd6660edec3cfd4d5ab2c35c5bcbfeb406a4e0cc332a00bf34c01fc61707de44d'
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.5 >/dev/null 2>&1; then
            echo '::error::Release v1.4.5 already exists; refusing to overwrite it.'
            exit 1
          fi
          APK_SHA=$(sha256sum "$ASSET_DIR/xhs-upwon-1.4.5-release.apk" | cut -d ' ' -f1)
          cat > /tmp/xhs-release-notes.md <<'NOTES'
          ## 红薯下载器 1.4.5

          - 应用名称改为“红薯下载器”，并加入原创 3D 红薯下载吉祥物图标。
          - 修复首页下载记录缩略图无法查看；首页与详情页均使用应用内全屏预览、左右切换。
          - 支持双指缩放、放大后拖动、双击放大或复原。
          - 合并式及同记录内配套视频的分离式实况照片支持长按静音播放，松开恢复照片。
          - 仅保存静态照片的旧记录需要重新下载动态视频。
          - 模拟器回归 3 项通过：详情页点击与翻页、首页缩略图点击与翻页、合并及分离实况视频提取配对。
          - 回归报告：https://github.com/upwon/XHS_Downloader_Android/actions/runs/40215957710
          - 双指缩放及长按播放在具体设备上的手势与渲染仍需真机确认。
          - 包名保持 `com.upwon.xhsdn`，与上一版相同签名证书，可直接升级。

          **下载 `xhs-upwon-1.4.5-release.apk` 安装。**
          如果当前安装的是此前的 debug 测试 APK，需要先卸载；正式版使用 AniCh 现有 release 证书签名。

          源代码：`55ea586cb2186202458b17c0bd2b5159e8f95602`
          签名构建：https://github.com/upwon/AniCh/actions/runs/40214971986
          APK SHA-256：`3dac560119c18cb52a7014109d0e5c413f0f62474c9f1d6ca031b7165bdae239`
          NOTES
          gh release create v1.4.5 \
            "$ASSET_DIR/xhs-upwon-1.4.5-release.apk" \
            "$ASSET_DIR/SHA256SUMS.txt" \
            "$ASSET_DIR/signing-certificate.txt" \
            "$ASSET_DIR/SOURCE_COMMIT.txt" \
            --target 55ea586cb2186202458b17c0bd2b5159e8f95602 \
            --title '红薯下载器 1.4.5' \
            --notes-file /tmp/xhs-release-notes.md \
            --prerelease
